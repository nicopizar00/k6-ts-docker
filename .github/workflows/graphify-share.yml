name: Graphify Share Guard

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-graphify-share:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Graphify shared artifacts
        run: python3 ai.ingest/validate_graphify_share.py
